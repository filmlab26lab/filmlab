# XcodeGen 工程描述文件
# 用途：在 macOS 上用 `xcodegen generate` 生成 FilmLab.xcodeproj
# 之所以不直接放 .xcodeproj（那是一堆极易手工写错的 XML），是因为 project.yml 更好改、更好审
# 生成方式见 docs/02_签名与安装步骤.md

name: FilmLab
options:
  bundleIdPrefix: com.filmlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FilmLab:
    type: application
    platform: iOS
    sources:
      - path: FilmLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filmlab.test
        PRODUCT_NAME: FilmLab
        TARGETED_DEVICE_FAMILY: "1,2"          # 1=iPhone 2=iPad
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGNING_ALLOWED: NO               # 云编译产出的未签名包，回到 Windows 再用爱思签名
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: FilmLab/Info.plist
      properties:
        CFBundleDisplayName: FilmLab
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        MinimumOSVersion: "17.0"
        # 照片项目要读相册（选片）和写相册（导出），这两条文案会出现在系统授权弹窗上
        NSPhotoLibraryUsageDescription: "选择要调色的照片或视频，只在设备本地处理，不上传。"
        NSPhotoLibraryAddUsageDescription: "把调好胶片效果的照片和视频存进你的相册。"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  FilmLab:
    build:
      targets:
        FilmLab: all
    run:
      config: Release

